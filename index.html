<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exhibitly — Binnenkort</title>

    <style>
        :root {
            --cream: #f7f1e7;
            --ink: #191614;
            --muted: rgba(25, 22, 20, 0.62);
            --line: rgba(25, 22, 20, 0.12);
            --blue: #6f93a8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--cream);
            color: var(--ink);
        }

        .page {
            min-height: 100vh;
            padding: clamp(14px, 3vw, 38px);
            display: flex;
        }

        .frame {
            position: relative;
            width: 100%;
            min-height: calc(100vh - clamp(28px, 6vw, 76px));
            border-radius: 42px;
            overflow: hidden;

            background:
                linear-gradient(
                    90deg,
                    rgba(247, 241, 231, 0.97) 0%,
                    rgba(247, 241, 231, 0.92) 34%,
                    rgba(247, 241, 231, 0.52) 62%,
                    rgba(247, 241, 231, 0.12) 100%
                ),
                url("https://images.unsplash.com/photo-1518998053901-5348d3961a04?auto=format&fit=crop&w=1800&q=85");

            background-size: cover;
            background-position: center right;

            border: none;
            outline: 1px solid rgba(25, 22, 20, 0.055);
            outline-offset: -1px;

            box-shadow:
                0 36px 120px rgba(33, 28, 24, 0.13),
                inset 0 0 0 1px rgba(255, 250, 243, 0.42);

            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .topbar {
            position: relative;
            z-index: 2;
            padding: clamp(24px, 4vw, 54px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            color: var(--ink);
            text-decoration: none;
        }

        .logo {
            width: 64px;
            height: 64px;
            display: block;
            flex: 0 0 auto;
        }

        .brand-name {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 31px;
            font-weight: 400;
            letter-spacing: -0.055em;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(25, 22, 20, 0.7);
            white-space: nowrap;
        }

        .status::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--blue);
            box-shadow: 0 0 0 6px rgba(111, 147, 168, 0.18);
        }

        .hero {
            position: relative;
            z-index: 2;
            padding: 0 clamp(24px, 4vw, 54px) clamp(36px, 5vw, 72px);
            max-width: 780px;
        }

        .kicker {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 24px;
        }

        h1 {
            max-width: 850px;
            font-family: Georgia, "Times New Roman", serif;
            font-weight: 400;
            font-size: clamp(54px, 10vw, 132px);
            line-height: 0.88;
            letter-spacing: -0.075em;
            margin-bottom: 34px;
        }

        .intro {
            max-width: 540px;
            font-size: clamp(16px, 1.6vw, 20px);
            line-height: 1.68;
            color: var(--muted);
        }

        .actions {
            margin-top: 38px;
            display: flex;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        .instagram {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--ink);
            text-decoration: none;
            font-size: 14px;
            padding-bottom: 7px;
            border-bottom: 1px solid currentColor;
            transition: opacity 0.2s ease;
        }

        .instagram:hover {
            opacity: 0.55;
        }

        .instagram svg {
            width: 17px;
            height: 17px;
        }

        .small-note {
            font-size: 13px;
            color: rgba(25, 22, 20, 0.52);
        }

        .footer {
            position: relative;
            z-index: 2;
            padding: 0 clamp(24px, 4vw, 54px) clamp(24px, 4vw, 42px);
            display: flex;
            justify-content: space-between;
            gap: 24px;
            font-size: 13px;
            color: rgba(25, 22, 20, 0.54);
        }

        @media (max-width: 980px) {
            .frame {
                background:
                    linear-gradient(
                        rgba(247, 241, 231, 0.9),
                        rgba(247, 241, 231, 0.68)
                    ),
                    url("https://images.unsplash.com/photo-1518998053901-5348d3961a04?auto=format&fit=crop&w=1400&q=85");
                background-size: cover;
                background-position: center;
            }

            .hero {
                max-width: 680px;
            }
        }

        @media (max-width: 640px) {
            .page {
                padding: 12px;
            }

            .frame {
                min-height: calc(100vh - 24px);
                border-radius: 30px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .brand {
                gap: 12px;
            }

            .logo {
                width: 54px;
                height: 54px;
            }

            .brand-name {
                font-size: 27px;
            }

            .status {
                font-size: 11px;
            }

            h1 {
                font-size: clamp(48px, 18vw, 78px);
            }

            .actions {
                align-items: flex-start;
                flex-direction: column;
                gap: 14px;
            }

            .footer {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="frame">
            <header class="topbar">
                <a href="#" aria-label="Exhibitly home" class="brand">
                    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="logo-title logo-desc">
                        <title id="logo-title">Exhibitly icon</title>
                        <desc id="logo-desc">A minimalist ticket frame with a serif E and a small blue underline.</desc>

                        <g>
                            <path d="M330 285 H474
                                     C474 315 550 315 550 285
                                     H694 V739
                                     H550
                                     C550 709 474 709 474 739
                                     H330 Z
                                     M365 320 V704 H478
                                     C492 682 532 682 546 704
                                     H659 V320 H546
                                     C532 342 492 342 478 320 Z"
                                  fill="#111111"
                                  fill-rule="evenodd"/>

                            <text x="512" y="588"
                                  text-anchor="middle"
                                  font-family="Georgia, 'Times New Roman', serif"
                                  font-size="245"
                                  font-weight="700"
                                  fill="#111111">E</text>

                            <rect x="441" y="637" width="142" height="15" fill="#6F93A8"/>
                        </g>
                    </svg>

                    <span class="brand-name">Exhibitly</span>
                </a>

            </header>

            <section class="hero">

                <h1>Zie meer. Zoek minder.</h1>

                <p class="intro">
                    Exhibitly wordt een eenvoudige gids voor tijdelijke expo’s.
                    Kunst, fotografie, design, erfgoed en cultuur verzameld op één plek.
                </p>

                <div class="actions">
                    <a
                        href="https://www.instagram.com/exhibitly.be/"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="instagram"
                    >
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.7"/>
                            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/>
                            <circle cx="17.3" cy="6.8" r="1" fill="currentColor"/>
                        </svg>
                        Volg ons op Instagram
                    </a>

                </div>
            </section>

            <footer class="footer">
                <span>© 2026 Exhibitly</span>
            </footer>
        </section>
    </main>
</body>
</html>
